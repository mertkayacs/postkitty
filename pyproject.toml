# Hermes reads the dependencies from here and prefers this file over plugin.yaml; older Hermes reads the
# python_dependencies list in plugin.yaml. Keep both lists identical (tests/test_plugin.py checks it).
# There is no build system on purpose: postkitty is installed as a Hermes plugin folder.
[project]
name = "postkitty"
version = "1.0.1"
description = "One post in, every platform out. A Hermes Agent plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "opencv-contrib-python-headless>=4.10,<5",
    "numpy>=2.0,<3",
    "Pillow>=10.1,<14",
    "regex>=2024.1.1,<2027",
    "ruamel.yaml>=0.18,<0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not real_detector'"
markers = ["real_detector: runs the real face detector (CI only, needs POSTKITTY_REAL_DETECTOR=1)"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# ASS subtitle headers must stay single lines.
"engine/video/captions.py" = ["E501"]
