# Dev tooling only. Runtime dependencies live in plugin.yaml.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not real_detector'"
markers = ["real_detector: runs the real face detector (CI only, needs POSTKITTY_REAL_DETECTOR=1)"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["lane-a.log"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Temporary until the media lanes merge: these tests install contract stubs before importing the engine.
"tests/test_camera.py" = ["E402"]
"tests/test_checks_video.py" = ["E402"]
"tests/test_video_make.py" = ["E402"]
"engine/captions.py" = ["E501"]
"engine/checks_video.py" = ["E501"]
