name: postkitty
version: "1.0.1"
manifest_version: 2
api_version: 1
description: One post in, every platform out. Fixes and rewrites your draft for each platform, crops photos and reframes landscape video with every face in frame, and checks every file for Instagram, TikTok, YouTube Shorts, X, LinkedIn, Threads, Bluesky and Facebook.
author: Mert Kaya
license: MIT
homepage: https://github.com/mertkayacs/postkitty
requires_hermes: ">=0.22.7"
tags: [social-media, video, images, copywriting, content-creation]
provides_tools:
  - postkitty_scan
  - postkitty_write
  - postkitty_make
  - postkitty_redo
  - postkitty_check
python_dependencies:
  - "opencv-contrib-python-headless>=4.10,<5"
  - "numpy>=2.0,<3"
  - "Pillow>=10.1,<14"
  - "regex>=2024.1.1,<2027"
  - "ruamel.yaml>=0.18,<0.19"
config_schema:
  output_dir:
    type: str
    default: ""
    label: "Output folder"
    description: "Where job folders are written. A relative path starts at the session working directory. Empty means a postkitty folder there."
  default_platforms:
    type: list
    default: []
    label: "Default platforms"
    description: "Platforms to make when a request names none, for example [\"x\", \"linkedin\"]. Names: instagram, tiktok, youtube, x, linkedin, threads, bluesky, facebook. Empty means every platform that fits the input."
  loudness_lufs:
    type: float
    default: -14
    label: "Loudness target (LUFS)"
    description: "Integrated loudness of video audio in LUFS, from -70 to -5."
