name: first-run

# What a new user does on a clean machine: install Hermes with the official installer, install the plugin,
# run the text, photo, video and captions flows and the /postkitty commands through Hermes' own plugin
# manager, tool registry and command dispatcher, then remove the plugin.
#
# There are two ways to install. A push, and a manual run by default, install the commit under test from the
# repository. The weekly run, and a manual run with install set to catalog, run the README command: Hermes
# looks the name up in its catalog and installs the commit pinned there. Such a run takes this repository at
# the pinned commit too, so the test script and the plugin match. Start one by hand after a catalog pin merges.
#
# Nothing installs ffmpeg here. Hermes brings its own and puts it first on PATH, so photos, video and captions
# run on the ffmpeg a user of that Hermes gets.

on:
  workflow_dispatch:
    inputs:
      install:
        description: "commit: this commit, from the repository. catalog: the README command, which installs the commit the Hermes catalog pins."
        type: choice
        options:
          - commit
          - catalog
        default: commit
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
    paths:
      - plugin.yaml
      - pyproject.toml
      - __init__.py
      - schemas.py
      - tools.py
      - command.py
      - cli.py
      - engine/**
      - skills/**
      - data/**
      - .github/workflows/first-run.yml
      - .github/scripts/first_run.py

permissions:
  contents: read

env:
  EXPECTED_HERMES: "0.23.1"
  MIN_HERMES: "0.22.7"
  PHOTO: team.jpg
  CLIP: notld.mp4

jobs:
  first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read the commit the Hermes catalog pins
        id: pin
        if: github.event_name == 'schedule' || inputs.install == 'catalog'
        run: |
          # The file Hermes reads when it looks a catalog name up.
          curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/plugin-catalog.json" \
            https://hermes-agent.nousresearch.com/docs/api/plugin-catalog.json
          sha=$(jq -r '.entries[] | select(.name == "postkitty") | .sha' "$RUNNER_TEMP/plugin-catalog.json")
          version=$(jq -r '.entries[] | select(.name == "postkitty") | .version' "$RUNNER_TEMP/plugin-catalog.json")
          echo "the catalog pins postkitty $version at $sha"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test -n "$version"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pin.outputs.sha || github.sha }}

      - name: Choose the work folders
        run: |
          {
            echo "LOG_DIR=$RUNNER_TEMP/first-run-logs"
            echo "FIRST_RUN_LOG_DIR=$RUNNER_TEMP/first-run-logs"
            echo "MEDIA_DIR=$RUNNER_TEMP/demo-media"
            echo "POSTKITTY_OUTPUT_DIR=$RUNNER_TEMP/postkitty-jobs"
          } >> "$GITHUB_ENV"

      - name: Confirm the runner has no ffmpeg of its own
        run: |
          if command -v ffmpeg || command -v ffprobe; then
            echo "::error::ubuntu-latest now ships ffmpeg; this run can no longer tell it from the one Hermes brings"
            exit 1
          fi
          echo "ffmpeg and ffprobe are absent, as expected on a clean runner"

      - name: Download the demo media and verify the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$MEDIA_DIR" "$LOG_DIR"
          gh release download demo-media -R mertkayacs/postkitty -D "$MEDIA_DIR" -p SHA256SUMS -p "$PHOTO" -p "$CLIP"
          cd "$MEDIA_DIR"
          grep -E " ($PHOTO|$CLIP)$" SHA256SUMS | sha256sum -c

      - name: Install Hermes with the official installer
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash 2>&1 | tee "$LOG_DIR/hermes-install.log"
          test "${PIPESTATUS[1]}" -eq 0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Print and check the Hermes version
        run: |
          hermes --version | tee "$LOG_DIR/hermes-version.txt"
          version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$LOG_DIR/hermes-version.txt" | head -1)
          test -n "$version"
          lowest=$(printf '%s\n%s\n' "$MIN_HERMES" "$version" | sort -V | head -1)
          if [ "$lowest" != "$MIN_HERMES" ]; then
            echo "::error::Hermes $version is older than the plugin's floor $MIN_HERMES"
            exit 1
          fi
          if [ "$version" != "$EXPECTED_HERMES" ]; then
            echo "::warning::the installer gave Hermes $version; this workflow was written against $EXPECTED_HERMES"
          fi
          command -v hermes
          echo "hermes launcher:"; cat "$(command -v hermes)"

      - name: Install the plugin
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -o pipefail
          # --yes-deps answers the Python dependency question up front; without it, and without a terminal,
          # Hermes skips the dependencies and leaves the plugin disabled.
          if [ -n "$PINNED_SHA" ]; then
            # The README command.
            set -- postkitty --yes-deps --enable
          else
            set -- mertkayacs/postkitty --yes-deps --enable --ref "${{ github.sha }}"
          fi
          echo "+ hermes plugins install $*"
          hermes plugins install "$@" 2>&1 | tee "$LOG_DIR/plugin-install.log"

      - name: Check that postkitty is installed and enabled
        env:
          PINNED_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          hermes plugins list | tee "$LOG_DIR/plugins-list.txt"
          hermes plugins list --json > "$LOG_DIR/plugins-list.json"
          python3 - "$LOG_DIR/plugins-list.json" <<'EOF'
          import json, os, sys
          rows = json.load(open(sys.argv[1]))
          row = next((r for r in rows if r["name"] == "postkitty"), None)
          print("postkitty row:", row)
          assert row is not None, "postkitty is not installed"
          assert row["status"] == "enabled", f"postkitty is not enabled: {row['status']}"
          pinned = os.environ.get("PINNED_VERSION")
          if pinned:
              assert row["version"] == pinned, f"the catalog pins {pinned}, Hermes installed {row['version']}"
              print("the installed version is the one the catalog pins:", pinned)
          EOF

      - name: Find the Python interpreter Hermes runs on
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          # The hermes entry point is a shell script that runs a bootstrap Python, which asks PM for the
          # committed dependency environment and puts the checkout plus that venv on PYTHONPATH. Do the same.
          root="$HOME/.hermes/hermes-agent"
          entry="$root/.hermes/bin/hermes"
          echo "entry point $entry starts with:"; head -c 300 "$entry"; echo
          boot=$(grep -oE '^exec [^ ]+' "$entry" | head -1 | awk '{print $2}')
          echo "bootstrap interpreter: $boot"
          "$boot" -I -c "
          import json, sys
          sys.path.insert(0, '$root')
          from pathlib import Path
          from pm.environments import activation_environment, project_python
          root = Path('$root')
          env = activation_environment(root)
          print('HERMES_PYTHON=' + str(project_python(root)))
          print('PYTHONPATH=' + env['PYTHONPATH'])
          " | tee -a "$GITHUB_ENV"
          python=$(grep '^HERMES_PYTHON=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)
          export PYTHONPATH=$(grep '^PYTHONPATH=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)
          test -x "$python"
          "$python" --version
          "$python" -c "import hermes_cli, tools.registry, cv2; print('hermes_cli at', hermes_cli.__file__); print('cv2', cv2.__version__)"

      - name: Text flow (no ffmpeg needed)
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/.github/scripts/first_run.py" text 2>&1 | tee "$LOG_DIR/phase-text.log"

      - name: Without any ffmpeg, a video gives a clear install message, and so does /postkitty doctor
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/.github/scripts/first_run.py" novideo "$MEDIA_DIR/$CLIP" 2>&1 | tee "$LOG_DIR/phase-novideo.log"

      - name: /postkitty doctor finds a complete setup with the ffmpeg Hermes brings
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/.github/scripts/first_run.py" doctor 2>&1 | tee "$LOG_DIR/phase-doctor.log"

      - name: Terminal command (hermes postkitty)
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          log="$LOG_DIR/phase-cli.log"
          hermes postkitty doctor 2>&1 | tee "$log"
          hermes postkitty platforms tiktok 2>&1 | tee -a "$log"
          grep -q "tiktok: 1080x1920 video" "$log"
          # Exit code 1 means the file was checked and does not pass; a landscape clip must not pass TikTok.
          code=0
          hermes postkitty check "$MEDIA_DIR/$CLIP" --target tiktok 2>&1 | tee -a "$log" || code=$?
          test "$code" -eq 1
          grep -q "$CLIP does not pass for tiktok" "$log"
          hermes postkitty make --text "Episode 42 is out. Reframing landscape video for vertical feeds." --platforms x,linkedin 2>&1 | tee -a "$log"
          grep -q "^job folder: " "$log"

      - name: Photo flow
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/.github/scripts/first_run.py" photo "$MEDIA_DIR/$PHOTO" 2>&1 | tee "$LOG_DIR/phase-photo.log"

      - name: Video and captions flow
        # Run from a neutral folder, as a user would, not from inside the plugin checkout.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/.github/scripts/first_run.py" video "$MEDIA_DIR/$CLIP" 2>&1 | tee "$LOG_DIR/phase-video.log"

      - name: Upload the job folders and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-run-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/postkitty-jobs
            !${{ runner.temp }}/postkitty-jobs/*/work
            ${{ runner.temp }}/first-run-logs
          if-no-files-found: warn

      - name: Remove the plugin and check it is gone
        if: always()
        run: |
          hermes plugins remove postkitty | tee "$LOG_DIR/plugin-remove.log"
          hermes plugins list --json > "$LOG_DIR/plugins-list-after.json"
          python3 - "$LOG_DIR/plugins-list-after.json" <<'EOF'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          assert all(r["name"] != "postkitty" for r in rows), "postkitty is still listed"
          print("postkitty is no longer listed")
          EOF
          test ! -e "$HOME/.hermes/plugins/postkitty"
