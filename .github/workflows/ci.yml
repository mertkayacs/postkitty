name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HERMES_COMMIT: b200f5bc60e31588ba2cb60e288029c4a54ba5fa

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Hermes supports Python 3.11 to 3.14 and a current install runs on 3.14.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo --preserve-env=RUNNER_TEMP,GITHUB_PATH bash .github/scripts/install_ffmpeg.sh
      # Homebrew's ffmpeg formula has no libass, which burning captions needs; ffmpeg-full has it and is keg-only.
      - name: Install ffmpeg with libass (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruamel.yaml pytest ruff hypothesis
          python -c "from ruamel.yaml import YAML; print('\n'.join(YAML(typ='safe').load(open('plugin.yaml'))['python_dependencies']))" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt"
      - run: ruff check .
      - run: python -m pytest

  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruamel.yaml
          python -c "from ruamel.yaml import YAML; print('\n'.join(YAML(typ='safe').load(open('plugin.yaml'))['python_dependencies']))" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt"
      - name: Tools, version and dependency lists agree
        run: python .github/scripts/check_consistency.py

  real-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTKITTY_REAL_DETECTOR: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        timeout-minutes: 10
        run: sudo --preserve-env=RUNNER_TEMP,GITHUB_PATH bash .github/scripts/install_ffmpeg.sh
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruamel.yaml pytest hypothesis
          python -c "from ruamel.yaml import YAML; print('\n'.join(YAML(typ='safe').load(open('plugin.yaml'))['python_dependencies']))" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt"
      - name: Cache the YuNet model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/postkitty/models
          key: yunet-8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
      - name: Run real detector tests
        run: |
          mkdir -p tests-output
          python -m pytest -m real_detector || [ $? -eq 5 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tests-output
          path: tests-output/
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # GitHub's release host answered 504 to setup-uv on 2026-11-08; PyPI serves uv from another CDN.
      - name: Install uv from PyPI
        run: python -m pip install "uv==0.13.7"
      - name: Install Hermes at the pinned commit in its own venv
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-src"
          git -C "$RUNNER_TEMP/hermes-src" checkout "$HERMES_COMMIT"
          printf 'Pillow==13.0.0\ncryptography==50.0.2\n' > "$RUNNER_TEMP/overrides.txt"
          uv venv "$RUNNER_TEMP/hermes-venv" --python "$(command -v python)"
          HERMES_NIX_BUILD=1 uv pip install --python "$RUNNER_TEMP/hermes-venv/bin/python" \
            --overrides "$RUNNER_TEMP/overrides.txt" "$RUNNER_TEMP/hermes-src"
          # Hermes reads its root pyproject.toml and uv.lock next to the package; a plain install omits them.
          site=$("$RUNNER_TEMP/hermes-venv/bin/python" -c "import hermes_cli, pathlib; print(pathlib.Path(hermes_cli.__file__).parent.parent)")
          cp "$RUNNER_TEMP/hermes-src/pyproject.toml" "$RUNNER_TEMP/hermes-src/uv.lock" "$site/"
      # The same command the plugin catalog runs at admission.
      - name: Validate the plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          "$RUNNER_TEMP/hermes-venv/bin/hermes" plugins validate "$GITHUB_WORKSPACE" --install-deps
      # Validation passes with a caution verdict, but an unattended install is blocked on it.
      - name: The install security scan says safe
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          "$RUNNER_TEMP/hermes-venv/bin/hermes" plugins validate "$GITHUB_WORKSPACE" --json > "$RUNNER_TEMP/validate.json"
          python .github/scripts/check_scan.py "$RUNNER_TEMP/validate.json"
      # Runs after validate, which installed the Python dependencies Plugin Doctor imports.
      - name: Run Plugin Doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          "$RUNNER_TEMP/hermes-venv/bin/hermes" plugins doctor "$GITHUB_WORKSPACE" --ci
