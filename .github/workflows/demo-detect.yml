name: demo-detect

# Records real YuNet face detections for the demo media release, so renders elsewhere can replay them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        timeout-minutes: 10
        run: sudo --preserve-env=RUNNER_TEMP,GITHUB_PATH bash .github/scripts/install_ffmpeg.sh
      - name: Install OpenCV
        run: pip install "opencv-contrib-python-headless>=4.9,<5" "numpy>=1.26,<3"
      - name: Fetch demo media
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download demo-media --repo "$GITHUB_REPOSITORY" --dir media && (cd media && sha256sum -c SHA256SUMS)
      - name: Fetch YuNet (OpenCV Zoo, pinned by SHA-256)
        run: |
          curl -sSfL -o yunet.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/48b10fa505aeb51fbd127fc60a5c660040e823b7/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  yunet.onnx" | sha256sum -c
      - name: Detect
        run: python .github/scripts/detect_media.py media faces yunet.onnx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faces
          path: faces
