# The postkitty entry of the Hermes plugin catalog (NousResearch/hermes-agent, plugin-catalog/postkitty.yaml).
# __COMMIT__ stands for the pinned commit. The catalog-gate workflow fills it in and runs Hermes' own
# admission checks on the result; a pin update sends this file, filled in, as a pull request there.
name: postkitty
repo: https://github.com/mertkayacs/postkitty
sha: __COMMIT__
title: postkitty
description: 'One post in, every platform out. Fixes and rewrites your draft for each platform and counts it with each
  platform''s own rule, splitting long posts into threads. Crops a photo and reframes landscape video so every face
  stays in frame; when two people talk, the choice is a split screen, a cut to whoever is talking or the whole wide
  shot. Burns captions from an .srt or .vtt file inside the platform''s safe area. Checks every file against the
  platform''s published limits and repairs failures before a file is marked ready. /postkitty doctor checks the
  setup, and the hermes postkitty terminal command runs the same steps from a script. Covers Instagram, TikTok,
  YouTube Shorts, X, LinkedIn, Threads, Bluesky and Facebook. Runs locally with ffmpeg and OpenCV; no API keys.'
maintainer: mertkayacs
tier: community
category: tools
version: "1.0.1"
requires_hermes: ">=0.22.7"
docs_url: https://postkitty.mertkayacs.com
image: https://raw.githubusercontent.com/mertkayacs/postkitty/__COMMIT__/docs/banner.png
screenshots:
  - https://raw.githubusercontent.com/mertkayacs/postkitty/__COMMIT__/docs/board.png
  - https://raw.githubusercontent.com/mertkayacs/postkitty/__COMMIT__/docs/before-after.jpg
  - https://raw.githubusercontent.com/mertkayacs/postkitty/__COMMIT__/docs/assets/readme/split-screen.jpg
known_issues:
  - Needs ffmpeg and ffprobe on PATH for video.
capabilities:
  provides_tools:
    - postkitty_scan
    - postkitty_write
    - postkitty_make
    - postkitty_redo
    - postkitty_check
  provides_hooks: []
  provides_middleware: []
  requires_env: []
