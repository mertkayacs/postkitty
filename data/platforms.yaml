# Platform specs used by postkitty checks.
# Every limit carries its source, scope and check date. enforcement: hard blocks ready/ and triggers a repair;
# enforcement: recommendation produces an advisory note only.
# source_scope: api (the platform's developer documentation), official (its help centre, announcement or published
# code), ad (its advertising specification), secondary (no page of the platform itself could be read; such a limit
# stays a recommendation).
# Byte caps use decimal units (1 MB = 1,000,000 bytes), so a file that passes fits either reading of "MB".
schema: postkitty.platforms/1
checked_on: "2026-11-11"

platforms:
  instagram:
    label: Instagram
    text:
      limit: {value: 2200, unit: codepoints, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
              source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
      hashtags_max: {value: 5, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                     source_url: "https://www.instagram.com/p/DSalTolEbvf/",
                     note: "Instagram's @creators account, 18 December 2025; the Graph API reference still lists 30"}
      mentions_max: {value: 20, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                     source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
    playbook:
      - {text: "Caption up to 2,200 characters and up to 20 mentions per the Instagram Graph API media reference.",
         source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/",
         source_scope: api, checked_on: "2026-11-11"}
      - {text: "Up to 5 hashtags per post or reel: Instagram's @creators account announced the cap on 18 December 2025. The Graph API reference still lists 30.",
         source_url: "https://www.instagram.com/p/DSalTolEbvf/",
         source_scope: official, checked_on: "2026-11-11"}
    targets:
      instagram_reel:
        kind: video
        width: 1080
        height: 1920
        containers: {value: [mp4, mov], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                     source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        video_codecs: {value: [h264, hevc], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        audio_sample_rate: {value: 48000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                            source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        fps_min: {value: 23, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        fps_max: {value: 60, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        duration_min: {value: 3, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        duration_max: {value: 900, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        bytes_max: {value: 300000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                    source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        video_bps_max: {value: 25000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                        source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        audio_bps_max: {value: 128000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                        source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        safe_area: {value: {top: 0.14, bottom: 0.35, side: 0.06}, enforcement: recommendation, source_scope: ad,
                    checked_on: "2026-11-11",
                    source_url: "https://www.facebook.com/business/ads-guide/update/video/instagram-reels"}
      instagram_feed:
        kind: image
        width: 1080
        height: 1350
        formats: {value: [jpeg], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        bytes_max: {value: 8000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                    source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
        aspect_range: {value: ["4:5", "1.91:1"], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/"}
      instagram_story:
        kind: image_or_video
        width: 1080
        height: 1920
        duration_max: {value: 60, enforcement: recommendation, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media/",
                       note: "story videos published through the API"}
        safe_area: {value: {top: 0.14, bottom: 0.35, side: 0.06}, enforcement: recommendation, source_scope: ad,
                    checked_on: "2026-11-11",
                    source_url: "https://www.facebook.com/business/ads-guide/update/image/instagram-story"}

  tiktok:
    label: TikTok
    text:
      limit: {value: 2200, unit: utf16, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
              source_url: "https://developers.tiktok.com/doc/content-posting-api-reference-direct-post"}
    playbook:
      - {text: "Video caption up to 2,200 UTF-16 runes per the Content Posting API Direct Post reference.",
         source_url: "https://developers.tiktok.com/doc/content-posting-api-reference-direct-post",
         source_scope: api, checked_on: "2026-11-11"}
    targets:
      tiktok:
        kind: video
        width: 1080
        height: 1920
        containers: {value: [mp4, webm, mov], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                     source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}
        video_codecs: {value: [h264, hevc, vp8, vp9], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}
        fps_min: {value: 23, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}
        fps_max: {value: 60, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}
        dimension_min: {value: 360, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                        source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}
        dimension_max: {value: 4096, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                        source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}
        duration_max: {value: 600, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide",
                       note: "the API maximum; every creator can post 3 minutes, some accounts 5 or 10"}
        bytes_max: {value: 4000000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                    source_url: "https://developers.tiktok.com/doc/content-posting-api-media-transfer-guide"}

  youtube:
    label: YouTube Shorts
    text:
      limit: {value: 100, unit: codepoints, enforcement: recommendation, source_scope: official, checked_on: "2026-11-11",
              source_url: "https://support.google.com/youtube/answer/57407"}
    playbook:
      - {text: "Shorts are square or vertical videos up to three minutes (180 seconds); postkitty renders 9:16 (1080x1920). Video titles are limited to 100 characters.",
         source_url: "https://support.google.com/youtube/answer/15424877",
         source_scope: official, checked_on: "2026-11-11"}
    targets:
      youtube_shorts:
        kind: video
        width: 1080
        height: 1920
        duration_max: {value: 180, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                       source_url: "https://support.google.com/youtube/answer/15424877"}
        video_bps_max: {value: 8000000, enforcement: recommendation, source_scope: official, checked_on: "2026-11-11",
                        source_url: "https://support.google.com/youtube/answer/1722171",
                        note: "1080p SDR at 24 to 30 fps; YouTube recommends 12 Mbps at 48 to 60 fps"}

  x:
    label: X
    text:
      limit: {value: 280, unit: x_weighted, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
              source_url: "https://github.com/twitter/twitter-text/blob/master/config/v3.json"}
    playbook:
      - {text: "Posts up to 280 weighted characters per twitter-text v3 (maxWeightedTweetLength 280).",
         source_url: "https://github.com/twitter/twitter-text/blob/master/config/v3.json",
         source_scope: official, checked_on: "2026-11-11"}
    targets:
      x_video:
        kind: video
        width: 1920
        height: 1080
        duration_max: {value: 140, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                       source_url: "https://help.x.com/en/using-x/x-videos",
                       note: "accounts without Premium; the X API media guide lists 20 minutes for a default account"}
        bytes_max: {value: 512000000, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                    source_url: "https://help.x.com/en/using-x/x-videos",
                    note: "accounts without Premium; the X API media guide lists 8 GB for a default account"}
      x_image:
        kind: image
        width: 1600
        height: 900
        formats: {value: [jpeg, png, gif, webp], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://docs.x.com/x-api/media/quickstart/best-practices"}
        bytes_max: {value: 5000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                    source_url: "https://docs.x.com/x-api/media/quickstart/best-practices"}

  linkedin:
    label: LinkedIn
    text:
      limit: {value: 3000, unit: codepoints, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
              source_url: "https://www.linkedin.com/help/linkedin/answer/a528176"}
    playbook:
      - {text: "Posts up to 3,000 characters. Single image: 1.91:1 horizontal, 1:1 square or 4:5 vertical recommended.",
         source_url: "https://www.linkedin.com/help/linkedin/answer/a426534",
         source_scope: ad, checked_on: "2026-11-11"}
    targets:
      linkedin_video:
        kind: video
        width: 1080
        height: 1350
        duration_min: {value: 3, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                       source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        duration_max: {value: 900, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                       source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        bytes_min: {value: 75000, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                    source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        bytes_max: {value: 5000000000, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                    source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        fps_min: {value: 10, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                  source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        fps_max: {value: 60, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                  source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        video_bps_max: {value: 30000000, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                        source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
        aspect_min: {value: 0.4167, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                     source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587", note: "1:2.4"}
        aspect_max: {value: 2.4, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                     source_url: "https://www.linkedin.com/help/linkedin/answer/a7174587"}
      linkedin_image:
        kind: image
        width: 1080
        height: 1080
        aspect_options: {value: ["1:1", "1.91:1", "4:5"], enforcement: recommendation, source_scope: ad, checked_on: "2026-11-11",
                         source_url: "https://www.linkedin.com/help/linkedin/answer/a426534"}

  threads:
    label: Threads
    text:
      limit: {value: 500, unit: codepoints, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
              source_url: "https://developers.facebook.com/docs/threads/overview",
              note: "Threads counts each emoji as its number of UTF-8 bytes, so a post with emoji reaches 500 sooner"}
    playbook:
      - {text: "Posts up to 500 characters, with each emoji counted as its UTF-8 bytes; videos up to 5 minutes (300 seconds).",
         source_url: "https://developers.facebook.com/docs/threads/overview",
         source_scope: api, checked_on: "2026-11-11"}
    targets:
      threads_video:
        kind: video
        width: 1080
        height: 1920
        containers: {value: [mp4, mov], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                     source_url: "https://developers.facebook.com/docs/threads/overview"}
        video_codecs: {value: [h264, hevc], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/threads/overview"}
        fps_min: {value: 23, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.facebook.com/docs/threads/overview"}
        fps_max: {value: 60, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.facebook.com/docs/threads/overview"}
        duration_max: {value: 300, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                       source_url: "https://developers.facebook.com/docs/threads/overview"}
        bytes_max: {value: 1000000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                    source_url: "https://developers.facebook.com/docs/threads/overview"}
      threads_image:
        kind: image
        width: 1080
        height: 1350
        formats: {value: [jpeg, png], enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                  source_url: "https://developers.facebook.com/docs/threads/overview"}
        bytes_max: {value: 8000000, enforcement: hard, source_scope: api, checked_on: "2026-11-11",
                    source_url: "https://developers.facebook.com/docs/threads/overview"}

  bluesky:
    label: Bluesky
    text:
      limit: {value: 300, unit: graphemes, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
              source_url: "https://github.com/bluesky-social/atproto/blob/main/packages/api/lexicons/app/bsky/feed/post.json"}
      bytes_max: {value: 3000, unit: utf8_bytes, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                  source_url: "https://github.com/bluesky-social/atproto/blob/main/packages/api/lexicons/app/bsky/feed/post.json"}
    playbook:
      - {text: "Post text up to 300 graphemes and 3,000 bytes (UTF-8) per the app.bsky.feed.post lexicon.",
         source_url: "https://github.com/bluesky-social/atproto/blob/main/packages/api/lexicons/app/bsky/feed/post.json",
         source_scope: official, checked_on: "2026-11-11"}
    targets:
      bluesky_video:
        kind: video
        width: 1080
        height: 1920
        bytes_max: {value: 300000000, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                    source_url: "https://github.com/bluesky-social/atproto/blob/main/packages/api/lexicons/app/bsky/embed/video.json"}
        duration_max: {value: 600, enforcement: recommendation, source_scope: official, checked_on: "2026-11-11",
                       source_url: "https://github.com/bluesky-social/social-app/blob/main/src/lib/constants.ts",
                       note: "not specified in the app.bsky.embed.video lexicon; client constant"}
      bluesky_image:
        kind: image
        width: 1080
        height: 1350
        bytes_max: {value: 2000000, enforcement: hard, source_scope: official, checked_on: "2026-11-11",
                    source_url: "https://github.com/bluesky-social/atproto/blob/main/packages/api/lexicons/app/bsky/embed/images.json"}

  facebook:
    label: Facebook
    text:
      limit: {value: 63206, unit: codepoints, enforcement: recommendation, source_scope: secondary, checked_on: "2026-11-11",
              source_url: "https://www.facebook.com/help/", note: "not confirmed on a Facebook help or developer page; value carried from seed data"}
    playbook:
      - {text: "Posts up to 63,206 characters (seed value, secondary; not confirmed on a Facebook help or developer page).",
         source_url: "https://www.facebook.com/help/",
         source_scope: secondary, checked_on: "2026-11-11"}
    targets:
      facebook_reel:
        kind: video
        width: 1080
        height: 1920
        aspect_options: {value: ["9:16"], enforcement: recommendation, source_scope: api, checked_on: "2026-11-11",
                         source_url: "https://developers.facebook.com/docs/video-api/guides/reels-publishing",
                         note: "1080 x 1920 recommended, 540 x 960 minimum"}
      facebook_feed:
        kind: image
        width: 1080
        height: 1350
        aspect_options: {value: ["4:5"], enforcement: recommendation, source_scope: ad, checked_on: "2026-11-11",
                         source_url: "https://www.facebook.com/business/ads-guide/update/image/facebook-feed"}
